# Standalone SpectraFX V2 diagnostic validation without full engine build.
# Each runner compiles the actual repo headers and CLI, checks ZIP extraction,
# malformed bytes, and default privacy redaction. Metal runtime is NOT tested.
name: SpectraFX standalone diagnostic validation

on:
  push:
    branches:
      - feature/universal-entity-inspector-fps
    paths:
      - 'engine/fx/SpectraCheckpoint*.h'
      - 'engine/fx/SpectraDiagnostic*.h'
      - 'engine/fx/SpectraGpuCheckpoint.h'
      - 'tools/spectrafx/**'
      - 'tests/vfx_spfx_diagnostics_test.cpp'
      - '.github/workflows/spectrafx-diagnostics.yml'
  pull_request:
    paths:
      - 'engine/fx/SpectraCheckpoint*.h'
      - 'engine/fx/SpectraDiagnostic*.h'
      - 'engine/fx/SpectraGpuCheckpoint.h'
      - 'tools/spectrafx/**'
      - 'tests/vfx_spfx_diagnostics_test.cpp'
      - '.github/workflows/spectrafx-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spfx-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Compile and test offline SPFX on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Compile offline inspector (C++20)
        run: c++ -std=c++20 -Wall -Wextra -Werror -O2 -I. tools/spectrafx/inspect_spfx.cpp -o inspect_spfx
      - name: Compile standalone regression (C++20)
        run: c++ -std=c++20 -Wall -Wextra -Werror -O2 -I. tests/vfx_spfx_diagnostics_test.cpp -o vfx_spfx_diagnostics_test
      - name: Execute standalone regression
        run: ./vfx_spfx_diagnostics_test
      - name: Check bounded CLI argument and missing-file behavior
        shell: bash
        run: |
          set +e
          ./inspect_spfx --json definitely_missing_stage44.spfx >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 2
