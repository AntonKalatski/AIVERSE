<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIVERSE catalog preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F3EFE8; color: #141210;
    font: 500 13px/1.3 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; pointer-events: none; }
  #bar button { pointer-events: auto; font: inherit; border: 1px solid #D6CEC2; background: rgba(251,249,245,.92);
    color: #141210; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #141210; color: #F3EFE8; border-color: #141210; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 13px "JetBrains Mono", ui-monospace, monospace;
    color: #5E574F; text-align: center; max-width: 80vw; }
  #hint { position: fixed; top: 10px; right: 12px; font: 400 12px "JetBrains Mono", ui-monospace, monospace; color: #5E574F; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<div id="hint">drag · wheel</div>
<div id="bar"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = (q.get('src') || '').replace(/\/+$/, '');
  var first = parseInt(q.get('item') || '0', 10) || 0;
  var statusEl = document.getElementById('status'), bar = document.getElementById('bar');
  function setStatus(t) { statusEl.textContent = t || ''; statusEl.hidden = !t; }
  if (!document.createElement('canvas').getContext('webgl2')) { setStatus('WebGL 2 is not available in this browser'); return; }
  if (!/^https:\/\//.test(src) && !/^(\.|\/)/.test(src)) { setStatus('No package view (?src=)'); return; }
  var view = null, loaded = {}, busy = false;
  function get(rel) {
    return fetch(src + '/' + rel).then(function (r) { if (!r.ok) throw new Error(rel + ': HTTP ' + r.status); return r.arrayBuffer(); });
  }
  function put(rel, buf) {
    var parts = ('/view/' + rel).split('/'), dir = '';
    for (var i = 1; i < parts.length - 1; ++i) { dir += '/' + parts[i]; try { Module.FS.mkdir(dir); } catch (e) {} }
    Module.FS.writeFile('/view/' + rel, new Uint8Array(buf));
    loaded[rel] = true;
  }
  function fetchAll(list) {
    var need = list.filter(function (f) { return !loaded[f]; });
    return Promise.all(need.map(function (f) { return get(f).then(function (b) { return [f, b]; }); }))
      .then(function (pairs) { pairs.forEach(function (p) { put(p[0], p[1]); }); });
  }
  function select(i) {
    if (busy || !view) return;
    busy = true; setStatus('Loading…');
    fetchAll(view.items[i].files || []).then(function () {
      Module._cv_select(i); setStatus('');
      bar.querySelectorAll('button').forEach(function (b, k) { b.setAttribute('aria-pressed', String(k === i)); });
    }).catch(function (e) { setStatus(String(e.message || e)); }).then(function () { busy = false; });
  }
  window.Module = {
    canvas: document.getElementById('canvas'),
    arguments: ['--item', String(first)],
    preRun: [function () {
      Module.addRunDependency('view');
      fetch(src + '/view.json').then(function (r) { if (!r.ok) throw new Error('view.json: HTTP ' + r.status); return r.text(); })
        .then(function (text) {
          view = JSON.parse(text);
          if (!view.items || !view.items.length) throw new Error('empty view');
          first = Math.min(Math.max(first, 0), view.items.length - 1);
          try { Module.FS.mkdir('/view'); } catch (e) {}
          Module.FS.writeFile('/view/view.json', text);
          return fetchAll((view.shared || []).concat(view.items[first].files || []));
        })
        .then(function () {
          view.items.forEach(function (it, k) {
            var b = document.createElement('button'); b.type = 'button'; b.textContent = it.title || it.id;
            b.setAttribute('aria-pressed', String(k === first)); b.onclick = function () { select(k); }; bar.appendChild(b);
          });
          if (view.items.length < 2) bar.hidden = true;
          setStatus('');
          Module.removeRunDependency('view');
        })
        .catch(function (e) { setStatus(String(e.message || e)); });
    }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function () {}
  };
  window.onerror = function () { setStatus('Error: see the browser console'); };
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
